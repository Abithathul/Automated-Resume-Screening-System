<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:Poppins;
    background:linear-gradient(135deg,#eef2ff,#fdf2f8);
    padding:40px;
}

/* TITLE */
h2{
    text-align:center;
    margin-bottom:30px;
}

/* CARD */
.container{
    max-width:1100px;
    margin:auto;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:15px;
}

/* HEADER */
th{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:white;
    padding:15px;
    text-align:left;
}

/* ROW */
td{
    padding:15px;
    border-bottom:1px solid #eee;
}

/* HOVER EFFECT */
tr:hover{
    background:#f9fafb;
}

/* BADGES */
.badge{
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    color:white;
}

.easy{background:#22c55e;}
.medium{background:#3b82f6;}
.hard{background:#ef4444;}

/* BUTTONS */
.btn{
    border:none;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-size:12px;
}

.edit{background:#f59e0b;}
.delete{background:#ef4444;}
.view{background:#10b981;}

.btn:hover{
    transform:scale(1.05);
}

/* INPUT ROW */
input{
    width:100%;
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
}

.add-btn{
    margin-top:15px;
    background:linear-gradient(135deg,#16a34a,#22c55e);
    padding:10px 20px;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

.add-btn:hover{
    transform:translateY(-2px);
}

</style>
</head>

<body>

<div class="container">

<h2>💼 Job Management System</h2>

<!-- ADD JOB -->
<table>
<tr>
<td><input type="text" id="role" placeholder="Job Role"></td>
<td><input type="text" id="company" placeholder="Company"></td>
<td><input type="text" id="skills" placeholder="Required Skills"></td>
<td><input type="text" id="exp" placeholder="Experience"></td>
<td>
<select id="level">
<option>Easy</option>
<option>Medium</option>
<option>Hard</option>
</select>
</td>
<td>
<button class="add-btn" onclick="addJob()">Add</button>
</td>
</tr>
</table>

<br>

<!-- JOB TABLE -->
<table>
<thead>
<tr>
<th>Role</th>
<th>Company</th>
<th>Skills</th>
<th>Experience</th>
<th>Level</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="jobTable"></tbody>

</table>

</div>

<script>

let jobs=[];

/* ADD */
function addJob(){

    let role=document.getElementById("role").value;
    let company=document.getElementById("company").value;
    let skills=document.getElementById("skills").value;
    let exp=document.getElementById("exp").value;
    let level=document.getElementById("level").value;

    if(!role || !company){
        alert("Fill all fields");
        return;
    }

    jobs.push({
        id:Date.now(),
        role,company,skills,exp,level
    });

    display();
    clearInputs();
}

/* DISPLAY */
function display(){

    let table=document.getElementById("jobTable");
    table.innerHTML="";

    jobs.forEach(j=>{

        let badgeClass=j.level.toLowerCase();

        table.innerHTML+=`
        <tr>
            <td>${j.role}</td>
            <td>${j.company}</td>
            <td>${j.skills}</td>
            <td>${j.exp}</td>
            <td><span class="badge ${badgeClass}">${j.level}</span></td>
            <td>
                <button class="btn edit" onclick="editJob(${j.id})">Edit</button>
                <button class="btn delete" onclick="deleteJob(${j.id})">Delete</button>
            </td>
        </tr>
        `;
    });
}

/* DELETE */
function deleteJob(id){
    jobs=jobs.filter(j=>j.id!==id);
    display();
}

/* EDIT */
function editJob(id){

    let j=jobs.find(x=>x.id===id);

    document.getElementById("role").value=j.role;
    document.getElementById("company").value=j.company;
    document.getElementById("skills").value=j.skills;
    document.getElementById("exp").value=j.exp;
    document.getElementById("level").value=j.level;

    deleteJob(id); // remove old before re-add
}

/* CLEAR */
function clearInputs(){
    document.getElementById("role").value="";
    document.getElementById("company").value="";
    document.getElementById("skills").value="";
    document.getElementById("exp").value="";
}

</script>

</body>
</html>
