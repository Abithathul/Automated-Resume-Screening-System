<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#dfe9f3,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

/* Gradient Border Container */
.container{
    background:#fff;
    width:100%;
    max-width:950px;
    border-radius:25px;
    display:flex;
    padding:6px;
    background:linear-gradient(135deg,#6c9bcf,#8ec5fc,#e0c3fc);
    box-shadow:0 20px 50px rgba(0,0,0,0.15);
}

.inner{
    background:#f9f9f9;
    border-radius:20px;
    display:flex;
    width:100%;
    overflow:hidden;
}

/* Left Section */
.left{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

/* Attractive Image Shape */
.left img{
    width:100%;
    max-width:300px;
    border-radius:20px;
    border:5px solid #fff;
    transform:rotate(-5deg);
    box-shadow:0 25px 50px rgba(0,0,0,0.3);
    transition:0.4s;
}

.left img:hover{
    transform:rotate(0deg) scale(1.05);
}




/* Right Section */
.right{
    flex:1;
    padding:50px 40px;
}

.right h2{
    font-size:32px;
    margin-bottom:25px;
    font-weight:600;
}

/* Input */
.input-group{
    position:relative;
    margin-bottom:25px;
}

.input-group i{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    color:#888;
}

.input-group input{
    width:100%;
    padding:12px 12px 12px 35px;
    border:none;
    border-bottom:2px solid #ccc;
    background:transparent;
    outline:none;
    font-size:14px;
    transition:0.3s;
}

.input-group input:focus{
    border-bottom:2px solid #6c9bcf;
}

/* Remember */
.remember{
    display:flex;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;
}

/* Button */
button{
    width:160px;
    padding:10px;
    border:none;
    background:linear-gradient(135deg,#6c9bcf,#4b82c3);
    color:#fff;
    border-radius:30px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* Error */
.error{
    font-size:13px;
    margin-top:10px;
}

/* Bottom */
.bottom{
    margin-top:40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.social i{
    width:35px;
    height:35px;
    text-align:center;
    line-height:35px;
    margin-left:10px;
    border-radius:50%;
    color:#fff;
    cursor:pointer;
    transition:0.3s;
}

.social i:hover{
    transform:scale(1.2);
}


.fa-google{background:#db4437;}

/* Responsive */
@media(max-width:900px){
    .inner{
        flex-direction:column;
        text-align:center;
    }

    .left{
        padding:30px;
    }

    .right{
        padding:30px;
    }

    button{
        width:100%;
    }

    .bottom{
        flex-direction:column;
        gap:15px;
    }
}
</style>
</head>

<body>

<div class="container">
<div class="inner">

    <div class="left">
        <img src="https://i.pinimg.com/1200x/86/8b/ed/868bedd4750e662f8268a0116dd17fc1.jpg" alt="Illustration">
    </div>

    <div class="right">
        <h2>Sign up</h2>

        <div class="input-group">
            <i class="fa fa-user"></i>
            <input type="text" id="username" placeholder="Your Name">
        </div>

        <div class="input-group">
            <i class="fa fa-lock"></i>
            <input type="password" id="password" placeholder="Password">
        </div>

       

        <form onsubmit="return validateForm()">
    <button type="submit">Log in</button>
</form>
        <div id="errorMsg" class="error"></div>

        <div class="bottom">
    
    <div class="social">
        <span>Or login with</span>

        
<i class="fab fa-google" onclick="loginGoogle()" style="cursor:pointer; font-size:24px;"></i>
    </div>
</div>

    </div>

</div>
</div>

<script>
function validateForm(){
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();
    let error = document.getElementById("errorMsg");

    error.style.color = "red";

    if(username === "" || password === ""){
        error.innerText = "Please fill all fields.";
        return false;
    }

    if(password.length < 6){
        error.innerText = "Password must be at least 6 characters.";
        return false;
    }

    if(username === "admin" && password === "123456"){
        error.style.color = "green";
        error.innerText = "Login Successful!";

        setTimeout(function(){
            window.location.href = "/index";
        }, 1000);

        return false;
    } else {
        error.innerText = "Invalid Username or Password.";
        return false;
    }
}


function loginGoogle() {
    const client = google.accounts.oauth2.initTokenClient({
        client_id: "710782665390-1jq8ru935m98e6f9i13uj396dour968j.apps.googleusercontent.com",
        scope: "profile email",
        prompt: "select_account",
        callback: (response) => {

            
            fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                headers: {
                    Authorization: "Bearer " + response.access_token
                }
            })
            .then(res => res.json())
            .then(data => {
                console.log(data);

                document.getElementById("errorMsg").style.color = "green";
                document.getElementById("errorMsg").innerText =
                    "Welcome " + data.name + " 🎉";

                // redirect
                setTimeout(() => {
                    window.location.href = "/index";
                }, 1500);
            });

        }
    });

    client.requestAccessToken();
}

function handleCredentialResponse(response) {
    const data = parseJwt(response.credential);

    document.getElementById("errorMsg").style.color = "green";
    document.getElementById("errorMsg").innerText =
        "Welcome " + data.name + " 🎉";

    setTimeout(() => {
        window.location.href = "/index";
    }, 1500);
}

/* JWT Decode */
function parseJwt(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    let jsonPayload = decodeURIComponent(
        atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join('')
    );

    return JSON.parse(jsonPayload);
}

</script>



</body>
</html>
